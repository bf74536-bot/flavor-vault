<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>FlavorVault - Discover & Review the Best Restaurants Near You</title>
    <meta name="title" content="FlavorVault - Discover & Review the Best Restaurants Near You" />
    <meta name="description" content="FlavorVault is your trusted restaurant discovery platform. Find top-rated restaurants, read authentic reviews, explore menus, and share your dining experiences. Discover Italian, Japanese, Mexican, and more cuisines." />
    <meta name="keywords" content="restaurant reviews, restaurant ratings, find restaurants, dining guide, food reviews, best restaurants, restaurant finder, menu reviews, cuisine guide" />
    <meta name="author" content="FlavorVault" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <link rel="canonical" href="https://flavorvault.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flavorvault.app/" />
    <meta property="og:title" content="FlavorVault - Discover & Review the Best Restaurants Near You" />
    <meta property="og:description" content="Find top-rated restaurants, read authentic reviews, explore menus, and share your dining experiences. Your trusted restaurant discovery platform." />
    <meta property="og:image" content="https://images.pexels.com/photos/2608049/pexels-photo-2608049.jpeg?auto=compress&cs=tinysrgb&w=1200" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="FlavorVault" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://flavorvault.app/" />
    <meta name="twitter:title" content="FlavorVault - Discover & Review the Best Restaurants Near You" />
    <meta name="twitter:description" content="Find top-rated restaurants, read authentic reviews, explore menus, and share your dining experiences." />
    <meta name="twitter:image" content="https://images.pexels.com/photos/2608049/pexels-photo-2608049.jpeg?auto=compress&cs=tinysrgb&w=1200" />

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#f59e0b" />
    <meta name="msapplication-TileColor" content="#f59e0b" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <!-- Font Loading -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FlavorVault",
      "url": "https://flavorvault.app/",
      "description": "Discover and review the best restaurants. Find top-rated dining spots, read authentic reviews, and share your culinary experiences.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://flavorvault.app/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FlavorVault",
      "url": "https://flavorvault.app/",
      "logo": "https://flavorvault.app/logo.svg",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "English"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
